<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKAS Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="tabs-container" id="tabs-container">
            <div class="tab active" data-tab-id="0">
                <span class="tab-title">Yeni Sekme</span>
                <button class="tab-close" title="Sekmeyi Kapat">&times;</button>
            </div>
        </div>
        <button id="new-tab-btn" class="new-tab-btn" title="Yeni Sekme (Ctrl+T)">+</button>
        <div class="tab-bar-actions">
            <button id="bookmarks-toggle" title="Yer İmleri (Ctrl+B)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
            </button>
            <button id="history-toggle" title="Geçmiş (Ctrl+H)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </button>
            <button id="downloads-btn" title="İndirilenler">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="nav-buttons">
            <button id="back-btn" title="Geri (Alt+←)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button id="forward-btn" title="İleri (Alt+→)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <button id="reload-btn" title="Yenile (Ctrl+R)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            </button>
            <button id="stop-btn" title="Durdur" style="display:none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg>
            </button>
            <button id="home-btn" title="Ana Sayfa">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
        </div>
        <div class="url-bar-container" id="url-bar-container">
            <span id="lock-icon" class="url-icon lock-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <div class="url-display" id="url-display">
                <span class="url-domain" id="url-domain"></span>
                <span class="url-rest" id="url-rest"></span>
            </div>
            <input type="text" id="url-input" class="url-input-hidden" placeholder="AKAS Browser'da arama yapın..." autocomplete="off" spellcheck="false">
            <button id="bookmark-star" class="url-icon bookmark-star" title="Bu sayfayı yer imlerine ekle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>
            <span id="shield-icon" class="url-icon shield-icon" title="AKAS Shield">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
        </div>
        <div class="toolbar-right">
            <div id="zoom-display" class="zoom-display" title="Yakınlaştırma">100%</div>
            <button id="zoom-out" title="Uzaklaştır (Ctrl+-)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button id="zoom-in" title="Yakınlaştır (Ctrl++)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button id="zoom-reset" title="Sıfırla (Ctrl+0)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
            </button>
            <div class="toolbar-divider"></div>
            <button id="screenshot-btn" title="Ekran Görüntüsü">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <button id="find-btn" title="Sayfada Ara (Ctrl+F)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <button id="devtools-btn" title="Geliştirici Araçları (F12)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </button>
            <button id="settings-btn" title="Ayarlar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            </button>
        </div>
    </div>

    <!-- Find Bar -->
    <div id="find-bar" class="find-bar">
        <input type="text" id="find-input" placeholder="Sayfada ara...">
        <span id="find-count" class="find-count">0 / 0</span>
        <button id="find-prev" title="Önceki">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
        <button id="find-next" title="Sonraki">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button id="find-close" title="Kapat (Esc)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <!-- Loading Bar -->
    <div class="loading-bar-container">
        <div id="loading-bar" class="loading-bar"></div>
    </div>

    <!-- Side Panels -->
    <div id="bookmarks-panel" class="side-panel">
        <div class="panel-header">
            <h3>Yer İmleri</h3>
            <button class="panel-close">&times;</button>
        </div>
        <div class="panel-content" id="bookmarks-list"></div>
    </div>

    <div id="history-panel" class="side-panel">
        <div class="panel-header">
            <h3>Geçmiş</h3>
            <button class="panel-close">&times;</button>
        </div>
        <div class="panel-content" id="history-list"></div>
    </div>

    <!-- Browser View Container -->
    <div class="browser-view-container">
        <webview id="web-view-0" class="browser-webview active" partition="persist:akas-session"></webview>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>AKAS Privacy Center</h3>
                <span id="close-modal" class="modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h4>Güvenlik</h4>
                    <div class="info-row">
                        <span>Engellenen Tracker</span>
                        <span class="info-value" id="tracker-count">0</span>
                    </div>
                    <div class="info-row">
                        <span>Engellenen Reklam</span>
                        <span class="info-value" id="ad-count">0</span>
                    </div>
                </div>
                <div class="settings-section">
                    <h4>Tor</h4>
                    <div id="tor-status-detail" class="info-row">
                        <span>Tor Bağlantısı</span>
                        <span class="info-value">Kontrol ediliyor...</span>
                    </div>
                    <button id="new-identity-btn" class="btn-info">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                        Yeni Tor Devresi Talep Et
                    </button>
                </div>
                <div class="settings-section">
                    <h4>Veriler</h4>
                    <button id="clear-data-btn" class="btn-danger">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                        Tüm Geçmiş ve Verileri Temizle
                    </button>
                </div>
                <div class="settings-section">
                    <h4>Hakkında</h4>
                <div class="about-info">
                    <div class="about-logo">
                        <img src="../../assets/akas-logo.png" alt="AKAS" style="width:100%;height:100%;object-fit:cover;border-radius:12px" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
                        <div style="display:none;width:100%;height:100%;background:linear-gradient(135deg,#fff,#333);border-radius:12px;place-items:center;font-size:1.5rem;font-weight:800;color:#000">A</div>
                    </div>
                    <div>AKAS Browser v1.2.0</div>
                    <div class="about-author">Mimar: <a href="#" onclick="window.akasAPI.openExternal('https://urasakas.com.tr')">Uras Akas</a></div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
